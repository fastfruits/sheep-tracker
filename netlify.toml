[build]
  command = "npx expo export -p web"
  publish = "dist"

# expo-router's static export writes the dynamic route as
# dist/profile/[userId].html, so a direct visit to /profile/<id> needs a rewrite.
[[redirects]]
  from = "/profile/*"
  to = "/profile/[userId].html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/+not-found.html"
  status = 404
